version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: certificate_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  whatsapp-service:
    build: ./whatsapp-service
    restart: unless-stopped
    environment:
      PORT: 4001
      WHATSAPP_SERVICE_TOKEN: change-me-to-a-long-random-string
    ports:
      - "4001:4001"
    volumes:
      - wa_auth:/app/auth_session
    # Run `docker compose logs -f whatsapp-service` the first time to scan the QR code.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
      - whatsapp-service
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/certificate_db
      WHATSAPP_SERVICE_URL: http://whatsapp-service:4001
      WHATSAPP_SERVICE_TOKEN: change-me-to-a-long-random-string
      COURSE_CENTER_NAME: "Your Course Center"
      DAILY_JOB_TIME: "09:00"
      FRONTEND_ORIGIN: "http://localhost:5173"
    ports:
      - "8000:8000"
    volumes:
      - certificates:/app/generated_certificates

volumes:
  pgdata:
  wa_auth:
  certificates:
